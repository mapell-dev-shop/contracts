[project]
name = "shop-contracts"
version = "1.0.0"
description = "Event contracts of the shop: JSON Schemas, the event envelope and Kafka helpers."
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.23",
    "confluent-kafka>=2.6",
]

[dependency-groups]
dev = ["pytest>=8.3", "mypy>=1.13", "ruff>=0.8", "types-jsonschema>=4.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
